name: Build and push image
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: "read"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-version:
    outputs:
      go-version: ${{ steps.go-version.outputs.go-version }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # ratchet:jdx/mise-action@v5.2.4
      - id: go-version
        run: echo "go-version=$(mise current go)" >> $GITHUB_OUTPUT
  checks:
    strategy:
      fail-fast: false
      matrix:
        mise-task:
          - check:deadcode
          - check:golangci-lint
          - check:gosec
          - check:govet
          - check:govulncheck
          - check:ratchet
          - check:staticcheck
          - ci:fmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # ratchet:jdx/mise-action@v5.2.4
      - run: mise run ${{ matrix.mise-task }}
  branch-protection-checkpoint:
    needs:
      - checks
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - if: ${{ needs.checks.result != 'success' }}
        run: exit 1
      - run: echo "All checks and builds passed."
  build_and_push:
    if: github.ref == 'refs/heads/main'
    needs:
      - go-version
      - branch-protection-checkpoint
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-26.04
    env:
      RUNNER_IMG: "gcr.io/distroless/static-debian12:nonroot"
      BASEIMG_IDENTITY: "keyless@distroless.iam.gserviceaccount.com"
      BASEIMG_ISSUER: "https://accounts.google.com"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # ratchet:sigstore/cosign-installer@v4.1.2
      - run: cosign verify --certificate-identity ${{ env.BASEIMG_IDENTITY }} --certificate-oidc-issuer ${{ env.BASEIMG_ISSUER }} ${{ env.RUNNER_IMG }}
      - uses: nais/platform-build-push-sign@07a21e2293624a78499c79eeea3ce6d314f8a8d9 # ratchet:nais/platform-build-push-sign@main
        id: build_push_sign
        with:
          name: console-github-auth
          build_args: |
            GO_VERSION=${{ needs.go-version.outputs.go-version }}
          google_service_account: gh-console-github-auth
          push: ${{ github.actor != 'dependabot[bot]' }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}

